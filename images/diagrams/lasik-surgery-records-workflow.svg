<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" style="background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%); border-radius: 16px; border: 1px solid #e2e8f0;">
    <defs>
        <filter id="shadow" x="-5%" y="-10%" width="115%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
        </filter>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0d9488"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
    </defs>
    <!-- Background grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <rect width="960" height="420" fill="url(#grid)"/>

    <!-- Header Banner -->
    <rect x="0" y="0" width="960" height="70" fill="url(#headerGrad)"/>
    <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">
        MEDICAL365 CLINICAL WORKFLOW ARCHITECTURE
    </text>
    <text x="925" y="42" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        OPHTHALMOLOGY EMR MODULE
    </text>

    <!-- Subtitle -->
    <text x="35" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
        Corneal Refractive Surgery & LASIK Clinical Lifecycle
    </text>
    <text x="35" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        Automated bidirectional data flow connecting diagnostic modalities, clinical reviews, and hospital EMR.
    </text>

    <!-- Workflow Nodes -->
    
        <!-- Node 1: Pre-Op Refractive & Topography Workup -->
        <g transform="translate(30, 175)">
            <rect width="150" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
            <rect width="150" height="6" rx="3" fill="#0d9488"/>
            <text x="75" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
                STEP 1
            </text>
            <text x="75" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
                Pre-Op Refractive
            </text>
            <text x="75" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
                & Topography Workup
            </text>
        </g>
        
        <!-- Arrow 1 -->
        <g transform="translate(180, 210)">
            <line x1="5" y1="0" x2="30" y2="0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4,2"/>
            <polygon points="33,0 25,-5 25,5" fill="#0d9488"/>
        </g>

        <!-- Node 2: Pachymetry & Residual Bed Calculator -->
        <g transform="translate(215, 175)">
            <rect width="150" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
            <rect width="150" height="6" rx="3" fill="#0d9488"/>
            <text x="75" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
                STEP 2
            </text>
            <text x="75" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
                Pachymetry &
            </text>
            <text x="75" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
                Residual Bed Calculator
            </text>
        </g>
        
        <!-- Arrow 2 -->
        <g transform="translate(365, 210)">
            <line x1="5" y1="0" x2="30" y2="0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4,2"/>
            <polygon points="33,0 25,-5 25,5" fill="#0d9488"/>
        </g>

        <!-- Node 3: Excimer / Femtosecond Laser Plan -->
        <g transform="translate(400, 175)">
            <rect width="150" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
            <rect width="150" height="6" rx="3" fill="#0d9488"/>
            <text x="75" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
                STEP 3
            </text>
            <text x="75" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
                Excimer /
            </text>
            <text x="75" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
                Femtosecond Laser Plan
            </text>
        </g>
        
        <!-- Arrow 3 -->
        <g transform="translate(550, 210)">
            <line x1="5" y1="0" x2="30" y2="0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4,2"/>
            <polygon points="33,0 25,-5 25,5" fill="#0d9488"/>
        </g>

        <!-- Node 4: Intra-Operative Flap & Ablation Log -->
        <g transform="translate(585, 175)">
            <rect width="150" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
            <rect width="150" height="6" rx="3" fill="#0d9488"/>
            <text x="75" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
                STEP 4
            </text>
            <text x="75" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
                Intra-Operative Flap
            </text>
            <text x="75" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
                & Ablation Log
            </text>
        </g>
        
        <!-- Arrow 4 -->
        <g transform="translate(735, 210)">
            <line x1="5" y1="0" x2="30" y2="0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4,2"/>
            <polygon points="33,0 25,-5 25,5" fill="#0d9488"/>
        </g>

        <!-- Node 5: Post-Op Visual Recovery EMR -->
        <g transform="translate(770, 175)">
            <rect width="150" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
            <rect width="150" height="6" rx="3" fill="#0d9488"/>
            <text x="75" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
                STEP 5
            </text>
            <text x="75" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
                Post-Op Visual
            </text>
            <text x="75" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
                Recovery EMR
            </text>
        </g>
        

    <!-- Footer Certification Badge -->
    <rect x="35" y="345" width="890" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="55" cy="367" r="8" fill="#10b981"/>
    <path d="M 52 367 L 55 370 L 60 364" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#334155">
        ABDM M1/M2/M3 Compliant • DPDP Act 2023 End-to-End Encryption • ISO 27001 Certified Health Cloud
    </text>
</svg>