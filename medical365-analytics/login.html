<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <title>Medical365 Executive Intelligence | Login</title>
    <link rel="icon" type="image/jpeg" href="/medical365fav.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(30, 64, 175, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0ea5e9, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .brand-title span {
            color: #38bdf8;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            width: 18px;
            height: 18px;
        }

        .form-input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .btn-eye:hover {
            color: #cbd5e1;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 12.5px;
            color: #94a3b8;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .remember-label input {
            accent-color: #0ea5e9;
            width: 15px;
            height: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-banner {
            display: none;
            padding: 12px 14px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #f87171;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-trust {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #1f293d;
            text-align: center;
            font-size: 11.5px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card" id="loginCard">
        <div class="brand-header">
            <div class="logo-box">
                <i data-lucide="shield-check" style="color:#ffffff; width:28px; height:28px;"></i>
            </div>
            <h1 class="brand-title">MEDICAL<span>365</span></h1>
            <p class="brand-subtitle">Executive Intelligence & Telemetry Dashboard</p>
        </div>

        <div id="errorBanner" class="error-banner" style="display:none;">
            <i data-lucide="alert-circle" style="width:16px; height:16px; flex-shrink:0;"></i>
            <span id="errorMessage">Invalid credentials. Please try again.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username / Email</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" class="form-input" placeholder="admin@medical365.in" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Master Passkey</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
                    <button type="button" class="btn-eye" onclick="togglePassword()">
                        <i id="eyeIcon" data-lucide="eye" style="width:16px; height:16px;"></i>
                    </button>
                </div>
            </div>

            <div class="remember-row">
                <label class="remember-label">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>Keep me logged in (7 days)</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Sign In to Dashboard</span>
                <i data-lucide="arrow-right" style="width:16px; height:16px;"></i>
            </button>
        </form>

        <div class="footer-trust">
            <i data-lucide="lock" style="width:12px; height:12px; color:#10b981;"></i>
            <span>256-Bit Encrypted Session Gate · Medical365 Core</span>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check if already authenticated
        (function() {
            var token = sessionStorage.getItem("m365_auth_session") || localStorage.getItem("m365_auth_session");
            if (token) {
                try {
                    var data = JSON.parse(atob(token));
                    if (data.auth && data.exp > Date.now()) {
                        window.location.replace("./");
                    }
                } catch (e) {}
            }
        })();

        function togglePassword() {
            var input = document.getElementById("password");
            var icon = document.getElementById("eyeIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.setAttribute("data-lucide", "eye-off");
            } else {
                input.type = "password";
                icon.setAttribute("data-lucide", "eye");
            }
            lucide.createIcons();
        }

        var failedAttempts = 0;

        function handleLogin(e) {
            e.preventDefault();
            var user = document.getElementById("username").value.trim().toLowerCase();
            var pass = document.getElementById("password").value.trim();
            var remember = document.getElementById("rememberMe").checked;
            var errorBanner = document.getElementById("errorBanner");
            var errorMsg = document.getElementById("errorMessage");
            var card = document.getElementById("loginCard");
            var btn = document.getElementById("submitBtn");

            // Check Rate Limiting
            var lockout = localStorage.getItem("m365_login_lockout");
            if (lockout && Number(lockout) > Date.now()) {
                var remainingMins = Math.ceil((Number(lockout) - Date.now()) / 60000);
                errorMsg.textContent = "Too many failed attempts. Locked out for " + remainingMins + " minute(s).";
                errorBanner.style.display = "flex";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Verifying credentials...</span>';

            setTimeout(function() {
                // Authorized Credentials
                var validUser = (user === "admin" || user === "admin@medical365.in" || user === "medical365");
                var validPass = (pass === "medical365@admin" || pass === "m365_admin_2026" || pass === "m365_admin_sec_2026");

                if (validUser && validPass) {
                    failedAttempts = 0;
                    localStorage.removeItem("m365_login_lockout");

                    var duration = remember ? (7 * 24 * 60 * 60 * 1000) : (2 * 60 * 60 * 1000); // 7 days or 2 hours
                    var tokenPayload = {
                        auth: true,
                        user: user,
                        exp: Date.now() + duration,
                        t: Date.now()
                    };
                    var token = btoa(JSON.stringify(tokenPayload));

                    if (remember) {
                        localStorage.setItem("m365_auth_session", token);
                    } else {
                        sessionStorage.setItem("m365_auth_session", token);
                    }

                    btn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
                    btn.innerHTML = '<span>Access Granted! Opening...</span>';

                    setTimeout(function() {
                        window.location.replace("./");
                    }, 400);
                } else {
                    failedAttempts++;
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In to Dashboard</span><i data-lucide="arrow-right" style="width:16px; height:16px;"></i>';
                    lucide.createIcons();

                    card.style.animation = "shake 0.4s ease";
                    setTimeout(function() { card.style.animation = ""; }, 400);

                    if (failedAttempts >= 5) {
                        var lockTime = Date.now() + (15 * 60 * 1000);
                        localStorage.setItem("m365_login_lockout", lockTime.toString());
                        errorMsg.textContent = "Too many failed attempts. Locked out for 15 minutes.";
                    } else {
                        errorMsg.textContent = "Invalid username or master passkey. (" + (5 - failedAttempts) + " attempt(s) remaining)";
                    }
                    errorBanner.style.display = "flex";
                }
            }, 300);
        }
    </script>
</body>
</html>
